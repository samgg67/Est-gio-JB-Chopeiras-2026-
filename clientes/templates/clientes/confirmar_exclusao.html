{% load static %}

<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão - JB Chopeiras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/cliente_confirmar_exclusao.css' %}">
</head>
<body>

<div class="container-exclusao">
    <div class="card-exclusao">

        <h4>Confirmar Exclusão</h4>

        <p>
            Tem certeza que deseja excluir o cliente
            <strong>{{ cliente.nome }}</strong>?
        </p>

        <div class="botoes-exclusao">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-excluir-custom">
                    Sim, excluir
                </button>
            </form>

            <a href="{% url 'clientesPage' %}" class="btn btn-dourado">
                Cancelar
            </a>
        </div>

    </div>
</div>

</body>
</html>
