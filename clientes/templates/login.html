{% extends 'base.html' %}
{% load static %}

{% block title %}
Entrar / Registrar - JB Chopeiras
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'clientes/css/login.css' %}">
{% endblock %}

{% block content %}

<main class="area-login">
    
    <div class="container-fluid" style="max-width: 1200px;">
       
        <div class="row g-4">
            
            <div class="col-12 col-md-6">
                
                <div class="box-form">
                   
                    <h2>Registrar</h2>
                   
                    <form method="post" action="{% url 'tela_entrada' %}">
                        {% csrf_token %}
                        <input type="hidden" name="tipo_form" value="registro">
                        <div class="mb-3">
                            <label class="form-label"> Nome </label>
                            <input type="text" name="nome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Email </label>
                            <input type="email", name="email", class="form-control", required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Senha </label>
                            <input type="password", name="senha", class="form-control". required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Confirmar senha </label>
                            <input type="password", name="confirmar_senha", class="form-control", required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Endereço </label>
                            <input type="text", name="endereco", class="form-control", required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label"> Telefone </label>
                            <input type="text", name="telefone", class="form-control", required>
                        </div>

                        <button type="submit", class="btn-amarelo"> Registrar </button>

                    </form>

                </div>

            </div>

            <div class="col-12 col-md-6">

                <div class="box-form">

                    <h2>Entrar</h2>

                    <form method="post", action="{% url 'tela_entrada' %}">
                        {% csrf_token %}
                        <input type="hidden", name="tipo_form", value="login">
                        <div class="mb-3">
                            <label class="form-label"> Email </label>
                            <input type="email", name="email", class="form-control", required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Senha </label>
                            <input type="password", name="senha", class="form-control". required>
                        </div>

                        <div class="mb-3">
                            <a href="#", class="link-recuperar"> Recuperar Senha </a>
                        </div>
                        <button type="submit", class="btn-amarelo"> Entrar
                        
                        </button>

                    </form>

                </div>

            </div>

        </div>

        {% if mensagem %}
            <div class="alert alert-warning mt-4 text-center">
                {{ mensagem }}
            </div>
        {% endif %}
    </div>
</main>
{% endblock %}
