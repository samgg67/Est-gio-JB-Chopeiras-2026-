{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/formulario.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{% url 'servicosPage' %}" class="btn btn-voltar">Voltar</a>
            <h1>{{ titulo }}</h1>
            <button type="submit" form="main-form" class="btn btn-salvar">Salvar</button>
        </div>

        <form id="main-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
        </form>
    </div>
</body>
</html>
