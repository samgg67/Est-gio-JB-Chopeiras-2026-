{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar / Registrar - JB Chopeiras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<header class="topo d-flex align-items-stretch">
    <div class="logo-wrap">
        <img src="{% static 'images/logo.png' %}" alt="Logo JB Chopeiras">
    </div>
    <nav class="menu-topo">
        <a href="{% url 'home' %}">Início</a>
        <a href="#">Dúvidas</a>
        <a href="{% url 'servicosPage' %}">Formulário</a>
        <a href="{% url 'clientesPage' %}">Formulário</a>
    </nav>
    <div class="usuario-topo ms-auto">
        <a href="{% url 'tela_entrada' %}" class="login-link">
            <div class="bolinha-user"></div>
            <span>Entrar / Registrar</span>
        </a>
    </div>
</header>

<main class="area-login">
    <div class="container-fluid" style="max-width: 1200px;">
        <div class="row g-4">

            <div class="col-12 col-md-6">
                <div class="box-form">
                    <h2>Registrar</h2>
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="tipo_form" value="registro">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar senha</label>
                            <input type="password" name="confirmar_senha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Endereço</label>
                            <input type="text" name="endereco" class="form-control">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="telefone" class="form-control">
                        </div>
                        <button type="submit" class="btn-amarelo">Registrar</button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="box-form">
                    <h2>Entrar</h2>
                    <form method="post" action="{% url 'tela_entrada' %}">
                        {% csrf_token %}
                        <input type="hidden" name="tipo_form" value="login">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <a href="#" class="link-recuperar">Recuperar Senha</a>
                        </div>
                        <button type="submit" class="btn-amarelo">Entrar</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</body>
</html>
